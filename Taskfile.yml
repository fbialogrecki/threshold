# https://taskfile.dev
version: '3'

# Taskfile = single source of truth (Konstytucja §17)
# Wszystkie powtarzalne komendy żyją tutaj i są używane lokalnie oraz w CI.

vars:
  WEB_DIR: apps/web
  SERVICES_DIR: services
  PROTO_DIR: libs/proto
  GENERATED_DIR: libs/generated
  IMAGE_REGISTRY: '{{default "threshold" .IMAGE_REGISTRY}}'
  IMAGE_TAG: '{{default "latest" .IMAGE_TAG}}'
  SERVICE: '{{default "web" .SERVICE}}'
  TASK_BIN: '{{default "go-task" .TASK_BIN}}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - '{{.TASK_BIN}} --list'

  # ─── Tooling / repo status ────────────────────────────────────────────

  doctor:
    desc: Check required local tooling without changing the system
    cmds:
      - |
        set -e
        for tool in bun git; do
          command -v "$tool" >/dev/null || { echo "missing required tool: $tool"; exit 1; }
        done
        if command -v go-task >/dev/null; then
          go-task --version
        elif command -v task >/dev/null && task --version | grep -qi 'Task version'; then
          task --version
        else
          echo "missing required tool: go-task from taskfile.dev"
          echo "Fedora package: go-task (binary: /usr/bin/go-task)"
          exit 1
        fi
        for tool in buf uv docker kubectl tilt kustomize; do
          if command -v "$tool" >/dev/null; then
            echo "ok: $tool"
          else
            echo "optional missing: $tool"
          fi
        done

  status:
    desc: Show concise repo status
    cmds:
      - git status --short
      - '{{.TASK_BIN}} --list'

  # ─── Web (Next.js + Bun) ──────────────────────────────────────────────

  web:install:
    desc: Install locked web dependencies
    dir: '{{.WEB_DIR}}'
    preconditions: &web-project
      - test -f package.json && test -f bun.lock
      - command -v bun
    cmds:
      - bun install --frozen-lockfile

  web:dev:
    desc: Start Next.js dev server with Bun
    dir: '{{.WEB_DIR}}'
    preconditions: *web-project
    cmds:
      - bun --bun next dev

  web:build:
    desc: Build web app for production
    dir: '{{.WEB_DIR}}'
    preconditions: *web-project
    cmds:
      - bun run build

  web:start:
    desc: Start production web server
    dir: '{{.WEB_DIR}}'
    preconditions: *web-project
    cmds:
      - bun run start

  web:lint:
    desc: Run installed ESLint for web app
    dir: '{{.WEB_DIR}}'
    preconditions:
      - test -f package.json && test -f bun.lock && test -f eslint.config.mjs
      - test -x node_modules/.bin/eslint
    cmds:
      - ./node_modules/.bin/eslint

  web:test:
    desc: Run web unit and packaging tests (not e2e)
    dir: '{{.WEB_DIR}}'
    preconditions:
      - test -f package.json && test -f bun.lock
      - command -v bun
      - >-
        python3 -c 'from pathlib import Path; assert all(Path(d).is_dir() and any(p.is_file() for pattern in ("*.test.ts", "*.test.tsx", "*.spec.ts", "*.spec.tsx") for p in Path(d).rglob(pattern)) for d in ("src", "tooling")), "Missing web unit test root or files"'
    cmds:
      - bun test ./src ./tooling

  web:typecheck:
    desc: Type-check web app with installed TypeScript
    dir: '{{.WEB_DIR}}'
    preconditions:
      - test -f package.json && test -f bun.lock && test -f tsconfig.json
      - test -x node_modules/.bin/tsc
    cmds:
      - ./node_modules/.bin/tsc --noEmit

  # ─── Python / services ───────────────────────────────────────────────

  py:install:
    desc: Install locked Python dependencies
    preconditions: &python-project
      - test -f pyproject.toml && test -f uv.lock
      - command -v uv
      - >-
        python3 -c 'import pathlib, tomllib; p = pathlib.Path; c = tomllib.loads(p("pyproject.toml").read_text()); assert all((p(m) / "pyproject.toml").is_file() for m in c["tool"]["uv"]["workspace"]["members"]), "Missing Python workspace project"'
    cmds:
      - uv sync --frozen

  py:lint:
    desc: Run Ruff
    preconditions: *python-project
    cmds:
      - uv run --frozen ruff check .

  py:format:
    desc: Format Python
    preconditions: *python-project
    cmds:
      - uv run --frozen ruff format .

  py:typecheck:
    desc: Run mypy
    preconditions: *python-project
    cmds:
      - uv run --frozen mypy .

  py:test:
    desc: Run pytest against the configured test roots
    preconditions:
      - test -f pyproject.toml && test -f uv.lock
      - command -v uv
      - >-
        python3 -c 'import pathlib, tomllib; p = pathlib.Path; c = tomllib.loads(p("pyproject.toml").read_text()); assert all(p(t).is_dir() for t in c["tool"]["pytest"]["ini_options"]["testpaths"]), "Missing configured test root"; assert all((p(m) / "pyproject.toml").is_file() and any((p(m) / "tests").rglob("test_*.py")) for m in c["tool"]["uv"]["workspace"]["members"]), "Missing workspace project or tests"'
    cmds:
      - uv run --frozen pytest

  python:system:
    desc: Run the separate rootless PostgreSQL and HTTP system lane
    preconditions:
      - test -f pyproject.toml && test -f uv.lock
      - command -v uv
      - command -v podman
      - >-
        python3 -c 'from pathlib import Path; root = Path("tests/system"); assert root.is_dir() and all((root / name).is_file() for name in ("test_database.py", "test_blocks_http.py", "test_block_decisions_http.py", "test_block_feed_freshness.py", "test_feed_users_outage.py", "test_resource_errors.py", "test_resource_lifecycle.py", "test_resource_fence.py")), "Missing system test root or expected tests"'
      - >-
        python3 -c 'import json, subprocess; info = json.loads(subprocess.check_output(["podman", "--remote=false", "info", "--format", "json"], timeout=30)); assert info["host"]["security"]["rootless"] is True and info["host"]["arch"] == "amd64", "System lane requires rootless amd64 Podman"'
    cmds:
      - podman --remote=false pull docker.io/library/postgres@sha256:1b13c640ae11f2f165d1e89667e5862b0017baf4c80fec2fb7377d86319859ba
      - uv run --frozen pytest -q tests/system

  service:dev:
    desc: Run a service locally, e.g. task service:dev SERVICE=auth-gateway
    dir: '{{.SERVICES_DIR}}/{{.SERVICE}}'
    preconditions:
      - test -f pyproject.toml && test -f ../../uv.lock && test -d src
      - command -v uv
    cmds:
      - |
        pkg=$(printf '%s' '{{.SERVICE}}' | tr '-' '_')
        uv run --frozen fastapi dev src/$pkg/main.py

  service:test:
    desc: Run tests for one service, e.g. task service:test SERVICE=users
    dir: '{{.SERVICES_DIR}}/{{.SERVICE}}'
    preconditions:
      - test -f pyproject.toml && test -f ../../uv.lock && test -d src
      - command -v uv
      - test -d tests
      - >-
        python3 -c 'from pathlib import Path; assert any(Path("tests").rglob("test_*.py")), "Missing service tests"'
    cmds:
      - uv run --frozen pytest

  service:lint:
    desc: Run lint for one service, e.g. task service:lint SERVICE=events
    dir: '{{.SERVICES_DIR}}/{{.SERVICE}}'
    preconditions:
      - test -f pyproject.toml && test -f ../../uv.lock && test -d src
      - command -v uv
    cmds:
      - uv run --frozen ruff check .

  # ─── Protobuf / buf ───────────────────────────────────────────────────

  proto:lint:
    desc: Lint protobuf schemas
    dir: '{{.PROTO_DIR}}'
    preconditions: &proto-project
      - test -f buf.yaml
      - command -v buf
    cmds:
      - buf lint

  proto:generate:
    desc: Generate protobuf code into libs/generated
    dir: '{{.PROTO_DIR}}'
    preconditions:
      - test -f buf.yaml && test -f buf.gen.yaml
      - command -v buf
    cmds:
      - buf generate

  proto:breaking:
    desc: Check protobuf breaking changes against main branch
    dir: '{{.PROTO_DIR}}'
    preconditions: *proto-project
    cmds:
      - buf breaking --against ../../.git#branch=main

  proto:check:
    desc: Lint and generate protobuf code
    cmds:
      - task: proto:lint
      - task: proto:generate

  # ─── Global gates ─────────────────────────────────────────────────────

  install:
    desc: Install all local dependencies
    cmds:
      - task: py:install
      - task: web:install

  lint:
    desc: Run all required linters
    cmds:
      - task: web:lint
      - task: py:lint
      - task: proto:lint

  typecheck:
    desc: Run all type checks
    cmds:
      - task: web:typecheck
      - task: py:typecheck

  test:
    desc: Run all tests
    cmds:
      - task: web:test
      - task: py:test

  build:
    desc: Build all buildable apps
    cmds:
      - task: web:build

  check:
    desc: Main local quality gate
    cmds:
      - task: lint
      - task: typecheck
      - task: test
      - task: build

  dev:
    desc: Start main local dev loop
    cmds:
      - task: web:dev

  # ─── Docker / registry ────────────────────────────────────────────────

  docker:build:web:
    desc: Build Docker image for web
    dir: '{{.WEB_DIR}}'
    cmds:
      - docker build -t {{.IMAGE_REGISTRY}}/web:{{.IMAGE_TAG}} .

  docker:push:web:
    desc: Push Docker image for web
    cmds:
      - docker push {{.IMAGE_REGISTRY}}/web:{{.IMAGE_TAG}}

  docker:build:service:
    desc: Build Docker image for SERVICE, e.g. task docker:build:service SERVICE=users IMAGE_TAG=dev
    cmds:
      - docker build -f {{.SERVICES_DIR}}/{{.SERVICE}}/Dockerfile -t {{.IMAGE_REGISTRY}}/{{.SERVICE}}:{{.IMAGE_TAG}} .

  docker:push:service:
    desc: Push Docker image for SERVICE
    cmds:
      - docker push {{.IMAGE_REGISTRY}}/{{.SERVICE}}:{{.IMAGE_TAG}}

  # ─── Repository safety ───────────────────────────────────────────────

  repo:secret-scan:
    desc: Lightweight repo scan for obvious committed secrets
    cmds:
      - |
        python3 - <<'PY'
        from pathlib import Path
        import re, sys

        skip_dirs = {'.git', 'node_modules', 'graphify-out', '.next', '.venv', '.mypy_cache', '.ruff_cache', '.pytest_cache', 'bun-dist', 'vendor'}
        private_key = re.compile(r'BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY', re.I)
        # High-signal only: quoted or YAML-like literal credential values.
        # Avoid variable references such as payload.password or password_hash fields.
        literal_secret = re.compile(
            r'''(?ix)
            \b(password|client_secret|private_key|access_key|secret_access_key|api_token|auth_token)\b
            [A-Za-z0-9_ -]*
            (?:[:=]|:\s*)\s*
            ["']?([A-Za-z0-9_./+=-]{20,})["']?
            '''
        )
        known_non_secret = re.compile(
            r'''(?ix)
            \b(passwordKey|secretKey|remoteRef|secretRef|password_hash|new_password|payload\.password|check\.value\.password|.*\.password|payload\.token|token=payload|password=payload)\b
            |\b(supersecret|StrongPass123|test-internal-token)\b
            '''
        )
        hits = []
        for path in Path('.').rglob('*'):
            if not path.is_file():
                continue
            if any(part in skip_dirs for part in path.parts) or path.suffix in {'.lock'}:
                continue
            try:
                text = path.read_text(errors='ignore')
            except Exception:
                continue
            for i, line in enumerate(text.splitlines(), 1):
                if known_non_secret.search(line):
                    continue
                if private_key.search(line) or literal_secret.search(line):
                    hits.append(f'{path}:{i}:{line[:180]}')
        if hits:
            print('\n'.join(hits))
            print('Potential secret-like strings found. Review required.')
            sys.exit(1)
        PY

  # ─── CI aliases ───────────────────────────────────────────────────────

  ci:lint:
    desc: CI lint pipeline
    cmds:
      - task: lint

  ci:test:
    desc: CI test pipeline
    cmds:
      - task: test

  ci:build:
    desc: CI build pipeline
    cmds:
      - task: build

  ci:check:
    desc: Full CI quality gate
    cmds:
      - task: check

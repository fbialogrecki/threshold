# release disabled until trusted external admission is installed
#
# Public source remains the validation authority, but it must not receive
# registry or GitOps writer credentials. The reviewed private operator release
# path will replace this informational workflow after W03 end-to-end acceptance.
when:
  - event: manual
    branch: main

steps:
  release-disabled:
    image: python:3.13-alpine@sha256:399babc8b49529dabfd9c922f2b5eea81d611e4512e3ed250d75bd2e7683f4b0
    commands:
      - |
        printf '%s\n' \
          'Release is disabled until trusted external admission is installed.' >&2
        exit 1

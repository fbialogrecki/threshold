[project]
name = "perlimen-workspace"
version = "0.1.0"
description = "Perlimen backend workspace"
requires-python = ">=3.13"
dependencies = [
  "perlimen-auth-gateway",
  "perlimen-events",
  "perlimen-media",
  "perlimen-social",
  "perlimen-users",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "httpx2>=2.12,<3",
  "mypy>=1.19",
  "pytest>=9.0",
  "pytest-asyncio>=1.3",
  "ruff>=0.14",
]

[tool.uv]
constraint-dependencies = [
  "cryptography>=50,<51",
  "fastapi>=0.139.2",
  "idna>=3.15",
  "pillow>=12.3.0",
  "pydantic-settings>=2.14.2",
  "pyjwt>=2.15.1",
  "starlette>=1.3.1",
  "urllib3>=2.8.0",
]

[tool.uv.sources]
perlimen-auth-gateway = { workspace = true }
perlimen-events = { workspace = true }
perlimen-media = { workspace = true }
perlimen-social = { workspace = true }
perlimen-users = { workspace = true }

[tool.uv.workspace]
members = [
  "libs/py",
  "services/auth-gateway",
  "services/events",
  "services/media",
  "services/social",
  "services/users",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["libs/py", "services"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["services", "libs/py/tests", "ops/tests", "ci/woodpecker/tests"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["perlimen_common", "auth_gateway", "events", "media", "users", "social"]
exclude = "(services/.*/migrations|services/.*/tests|ops/tests|scripts)"

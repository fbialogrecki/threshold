apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: threshold
resources:
  - ../../../base/auth-gateway
  - ingress.yaml
images:
  - name: threshold/auth-gateway
    newName: core.harbor.domain/threshold/auth-gateway
    digest: sha256:4cad74f49fdf5455d66062cd3681aaa3b2ed88509a2500287b3570a219c944f2
patches:
  - target:
      kind: ConfigMap
      name: auth-gateway-config
    patch: |-
      - op: replace
        path: /data/THRESHOLD_ENVIRONMENT
        value: local

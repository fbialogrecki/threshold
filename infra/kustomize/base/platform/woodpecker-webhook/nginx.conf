worker_processes 1;
pid /tmp/nginx.pid;
# Hook queries may contain authentication tokens.
error_log /dev/null;
events { worker_connections 128; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 25m;
    client_body_timeout 30s;
    server {
        listen 8080 default_server;
        server_name hooks.perlimen.com;
        if ($host != hooks.perlimen.com) { return 404; }
        # Check the raw path too: nginx otherwise normalizes slash/escape aliases.
        if ($request_uri !~ "^/api/hook(?:\?|$)") { return 404; }
        location = /api/hook {
            if ($request_method != POST) { return 405; }
            proxy_pass http://woodpecker-server.woodpecker.svc.cluster.local:80;
            proxy_http_version 1.1;
            proxy_set_header Host woodpecker.internal;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
        location / { return 404; }
    }
    server {
        listen 8081;
        location = /healthz { return 200 "ok\n"; }
        location / { return 404; }
    }
}

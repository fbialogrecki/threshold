apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudflared-web-only
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/part-of: threshold
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: threshold
          podSelector:
            matchLabels:
              app.kubernetes.io/name: web
      ports:
        - protocol: TCP
          port: 3000
    # Cloudflare's global IPv4 tunnel edges, not arbitrary Internet egress.
    - to:
        - ipBlock:
            cidr: 198.41.192.0/24
        - ipBlock:
            cidr: 198.41.200.0/24
      ports:
        - protocol: UDP
          port: 7844
        - protocol: TCP
          port: 7844

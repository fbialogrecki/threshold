apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: web-canonical-host
  namespace: threshold
spec:
  redirectRegex:
    regex: ^http://192\.168\.0\.108(?::80)?/(.*)
    replacement: https://threshold.internal/${1}
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: web-catchall-ip
  namespace: threshold
spec:
  entryPoints:
  - web
  routes:
  - kind: Rule
    match: Host(`192.168.0.108`)
    middlewares:
    - name: web-canonical-host
    services:
    - name: web
      port: http

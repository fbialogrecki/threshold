apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opentelemetry-collector-internal
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: threshold
      podSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - auth-gateway
          - users
          - social
          - events
          - media
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: threshold
      podSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - web
    ports:
    - protocol: TCP
      port: 4317
    - protocol: TCP
      port: 4318
---

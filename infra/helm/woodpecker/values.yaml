server:
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  env:
    WOODPECKER_ADMIN: "fbialogrecki"
    WOODPECKER_HOST: "https://woodpecker.internal"
    WOODPECKER_EXPERT_WEBHOOK_HOST: "https://hooks.perlimen.com"
    WOODPECKER_GITHUB: "true"
    WOODPECKER_BACKEND_KUBERNETES: "true"
  extraSecretNamesForEnvFrom:
    - woodpecker-github-oauth
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
      traefik.ingress.kubernetes.io/router.middlewares: woodpecker-https-redirect@kubernetescrd
    tls:
      - hosts:
          - woodpecker.internal
        secretName: woodpecker-internal-tls
    hosts:
      - host: woodpecker.internal
        paths:
          - path: /
            backend:
              serviceName: woodpecker-server
              servicePort: 80

agent:
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  env:
    WOODPECKER_AGENT_CONFIG_FILE: ""
    WOODPECKER_SERVER: "woodpecker-server:9000"
    WOODPECKER_BACKEND: kubernetes
    WOODPECKER_BACKEND_K8S_NAMESPACE: woodpecker-jobs
    WOODPECKER_BACKEND_K8S_NAMESPACE_PER_ORGANIZATION: "false"
    WOODPECKER_BACKEND_K8S_STORAGE_CLASS: local-path
    WOODPECKER_BACKEND_K8S_STORAGE_RWX: "false"
    WOODPECKER_BACKEND_K8S_VOLUME_SIZE: 10G
    WOODPECKER_CONNECT_RETRY_COUNT: "5"
  persistence:
    enabled: false
  serviceAccount:
    rbac:
      create: false
